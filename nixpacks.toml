[phases.setup]
nixPkgs = ["php81", "php81Extensions.pdo", "php81Extensions.pdo_mysql", "php81Extensions.mbstring", "php81Extensions.bcmath", "php81Extensions.curl", "php81Extensions.zip", "php81Extensions.openssl", "php81Extensions.tokenizer", "php81Extensions.xml", "php81Extensions.dom", "php81Extensions.fileinfo", "php81Extensions.intl", "php81Extensions.gd", "nodejs_20", "composer"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist",
  "npm ci"
]

[phases.build]
cmds = [
  "npm run build --if-present"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
